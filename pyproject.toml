[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.1.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "grid_pdf"
version = "0.0.0"
authors = ["PBSP Collaboration"]
description = "The grid pdf parameterisation "

[tool.poetry.dependencies]

# colibri needs to be installed from git
colibri = { git = "https://github.com/HEP-PBSP/colibri" }

[tool.poetry.extras]
test = [
    "pytest",
    "hypothesis",
]
doc = [
    "sphinx",
    "recommonmark",
    "sphinx_rtd_theme"
]

[tool.poetry.scripts]
grid_pdf = "grid_pdf.app:main"
